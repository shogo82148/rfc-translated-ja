# betterleaks / gitleaks の設定
# 既定のルールを使い、RFC の例文による誤検出だけを除外する。

[extend]
useDefault = true

[[allowlists]]
description = "RFC 7826 Appendix A.3 の MIKEY 例（英文を Base64 にしただけの値で、秘密情報ではない）"
condition = "AND"
regexTarget = "line"
regexes = ['''MIKEY=''']
paths = [
  '''(^|/)src/rfcs/rfc7826\.txt$''',
  '''(^|/)src/(en|ja)/rfc7826\.xml$''',
  '''(^|/)src/patches/rfc7826\.patch$''',
  '''(^|/)docs/rfc7826\.html$''',
]

[[allowlists]]
description = "RFC 2378 の CCSO Nameserver のコマンド例（例示用のパスワードで、秘密情報ではない）"
condition = "AND"
regexTarget = "line"
regexes = ['''password=NewSecret''']
paths = [
  '''(^|/)src/rfcs/rfc2378\.txt$''',
  '''(^|/)src/(en|ja)/rfc2378\.xml$''',
  '''(^|/)src/patches/rfc2378\.patch$''',
  '''(^|/)docs/rfc2378\.html$''',
]

[[allowlists]]
description = "RFC 2312 の ASN.1 型名 ChallengePassword（型の名前で、秘密情報ではない）"
condition = "AND"
regexTarget = "line"
regexes = ['''ChallengePassword''']
paths = [
  '''(^|/)src/rfcs/rfc2312\.txt$''',
  '''(^|/)src/(en|ja)/rfc2312\.xml$''',
  '''(^|/)src/patches/rfc2312\.patch$''',
  '''(^|/)docs/rfc2312\.html$''',
]

[[allowlists]]
description = "RFC 9909・9934・9935・9936・9977 のテストベクター・例示用の秘密鍵（RFC で公開されている値で、秘密情報ではない）"
condition = "AND"
regexTarget = "match"
regexes = ['''-----BEGIN (RSA )?PRIVATE KEY-----''']
paths = [
  '''(^|/)src/rfcs/rfc99(09|34|35|36|77)\.(txt|xml)$''',
  '''(^|/)src/(en|ja)/rfc99(09|34|35|36|77)\.xml$''',
  '''(^|/)docs/rfc99(09|34|35|36|77)\.html$''',
]

[[allowlists]]
description = "RFC 9950 の例示用の shared-secret（RFC で公開されている値で、秘密情報ではない）"
condition = "AND"
regexTarget = "line"
regexes = ['''"shared-secret": "QaEfThUkO198010075460923\+h3TbE8n"''']
paths = [
  '''(^|/)src/rfcs/rfc9950\.(txt|xml)$''',
  '''(^|/)src/(en|ja)/rfc9950\.xml$''',
  '''(^|/)docs/rfc9950\.html$''',
]
