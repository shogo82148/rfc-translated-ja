# betterleaks / gitleaks の設定
# 既定のルールを使い、RFC 本文とその訳・生成物はシークレット検出から除外する。
# RFC に含まれる秘密鍵やトークンは例示用に広く公開されている値で、秘密情報ではない。

[extend]
useDefault = true

[[allowlists]]
description = "RFC の原本・訳・生成物（RFC で公開されている例示値のみを含み、秘密情報ではない）"
paths = [
  '''(^|/)src/rfcs/rfc[0-9]+\.txt$''',
  '''(^|/)src/rfcs/rfc[0-9]+\.xml$''',
  '''(^|/)src/en/rfc[0-9]+\.xml$''',
  '''(^|/)src/ja/rfc[0-9]+\.xml$''',
  '''(^|/)src/patches/rfc[0-9]+\.patch$''',
  '''(^|/)docs/rfc[0-9]+\.html$''',
]
