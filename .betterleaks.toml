regexes = ['''^[0-9a-f]{40,}$''', '''^CorrectHorseBatteryStaple$''', '''^password$''']
paths = [
  '''(^|/)src/rfcs/rfc9807\.(txt|xml)$''',
  '''(^|/)src/(en|ja)/rfc9807\.xml$''',
  '''(^|/)docs/rfc9807\.html$''',
]

