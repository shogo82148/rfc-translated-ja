on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          cache: "pip"
      - uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: "5.44"

      - run: |
          pip install -r requirements.txt
          cpanm --installdeps --notest .
          make

      - name: check duplicate ids in generated HTML
        run: scripts/check-html-ids.py
